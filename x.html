
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
  </head>
  <body>
    <script src="/m/bundle.js"></script>
    <script src="/m/config.js"></script>
    <script>
      ;(async () => {
        try {
          const target = decodeURIComponent(location.pathname.slice(3))
          let url = target.trim()

          if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url
          }

          await navigator.serviceWorker.register('/sw.js', {
            scope: __uv$config.prefix,
          })

          location.replace(__uv$config.prefix + __uv$config.encodeUrl(url))
        } catch (error) {
          document.body.textContent = 'Unable to open URL: ' + error.message
        }
      })()
    </script>
  </body>
</html>

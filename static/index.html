    <script>
(() => {
  /*
   * If this page is already inside an iframe,
   * do nothing. This prevents the iframe from
   * triggering the Blob redirect again.
   */
  if (window.top !== window.self) {
    return;
  }

  /*
   * Create the iframe-wrapper page.
   */
  const wrapper = `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>​</title>

  <link
    rel="icon"
    href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnLz4="
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="frame"
    src="https://n3xn.vercel.app/"
    allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; display-capture; encrypted-media; fullscreen; geolocation; gyroscope; microphone; payment; picture-in-picture; speaker-selection; usb; web-share; xr-spatial-tracking"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen
    referrerpolicy="no-referrer">
  </iframe>

</body>
</html>`;

  /*
   * Make the wrapper into a Blob.
   */
  const blob = new Blob(
    [wrapper],
    {
      type: "text/html"
    }
  );

  /*
   * Immediately replace the current page.
   */
  const blobURL =
    URL.createObjectURL(blob);

  window.location.replace(blobURL);
})();
</script>

    <!-- ============================
         MONACO HTML MODE
         ============================ -->

    <script>
      (() => {

        const urlMode =
          document.getElementById(
            "url-mode"
          );

        const urlInput =
          document.getElementById(
            "is"
          );

        const editorContainer =
          document.getElementById(
            "html-editor-container"
          );

        const runButton =
          document.getElementById(
            "html-run"
          );

        let editor = null;

        let monacoReady = null;

        let switchingMode = false;

        /*
         * ============================
         * LOAD MONACO
         * ============================
         */

        function loadMonaco() {

          if (monacoReady) {
            return monacoReady;
          }

          monacoReady =
            new Promise(
              (resolve, reject) => {

                if (window.monaco) {

                  resolve(
                    window.monaco
                  );

                  return;
                }

                const loader =
                  document.createElement(
                    "script"
                  );

                loader.src =
                  "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js";

                loader.onload =
                  () => {

                    window.require.config(
                      {
                        paths: {
                          vs:
                            "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
                        }
                      }
                    );

                    window.require(
                      [
                        "vs/editor/editor.main"
                      ],

                      () => {

                        resolve(
                          window.monaco
                        );

                      },

                      reject
                    );

                  };

                loader.onerror =
                  reject;

                document.head.appendChild(
                  loader
                );

              }
            );

          return monacoReady;
        }

        /*
         * ============================
         * SWITCH TO HTML MODE
         * ============================
         */

        async function
        switchToHtmlMode(
          initialValue = "<"
        ) {

          if (switchingMode) {
            return;
          }

          switchingMode = true;

          urlMode.style.display =
            "none";

          editorContainer.style.display =
            "block";

          try {

            const monaco =
              await loadMonaco();

            if (!editor) {

              editor =
                monaco.editor.create(
                  document.getElementById(
                    "html-editor"
                  ),
                  {

                    value:
                      initialValue,

                    language:
                      "html",

                    theme:
                      "vs-dark",

                    automaticLayout:
                      true,

                    minimap: {
                      enabled:
                        false
                    },

                    fontSize:
                      14,

                    lineNumbers:
                      "on",

                    wordWrap:
                      "on",

                    scrollBeyondLastLine:
                      true,

                    scrollbar: {

                      vertical:
                        "auto",

                      horizontal:
                        "auto",

                      verticalScrollbarSize:
                        12,

                      horizontalScrollbarSize:
                        12

                    },

                    padding: {

                      top:
                        12,

                      bottom:
                        20

                    }

                  }
                );

              /*
               * Empty editor returns
               * to URL mode.
               */

              editor.onDidChangeModelContent(
                () => {

                  if (!editor) {
                    return;
                  }

                  const value =
                    editor.getValue();

                  if (
                    value.length ===
                    0
                  ) {

                    switchToUrlMode();

                  }

                }
              );

            } else {

              editor.setValue(
                initialValue
              );

              editor.layout();

            }

            editor.focus();

            editor.setPosition(
              {
                lineNumber:
                  1,

                column:
                  initialValue.length +
                  1
              }
            );

          } catch (error) {

            console.error(
              "Failed to load Monaco:",
              error
            );

            switchToUrlMode();

            urlInput.value =
              initialValue;

            urlInput.focus();

          } finally {

            switchingMode =
              false;

          }

        }

        /*
         * ============================
         * SWITCH TO URL MODE
         * ============================
         */

        function
        switchToUrlMode() {

          editorContainer.style.display =
            "none";

          urlMode.style.display =
            "";

          if (editor) {
            editor.setValue("");
          }

          urlInput.value =
            "";

          urlInput.focus();

        }

        /*
         * ============================
         * DETECT <
         * ============================
         */

        urlInput.addEventListener(
          "input",
          () => {

            if (switchingMode) {
              return;
            }

            const value =
              urlInput.value;

            if (
              value.startsWith("<")
            ) {

              switchToHtmlMode(
                value
              );

            }

          }
        );

        /*
         * ============================
         * RUN HTML
         * ============================
         */

        runButton.addEventListener(
          "click",
          () => {

            if (!editor) {
              return;
            }

            const html =
              editor.getValue();

            if (!html.trim()) {

              switchToUrlMode();

              return;
            }

            /*
             * FIRST BLOB
             */

            const firstBlob =
              new Blob(
                [html],
                {
                  type:
                    "text/html"
                }
              );

            const firstBlobUrl =
              URL.createObjectURL(
                firstBlob
              );

            /*
             * OPEN ABOUT:BLANK
             */

            const popup =
              window.open(
                "about:blank",
                "_blank"
              );

            if (
              !popup ||
              popup.closed
            ) {

              URL.revokeObjectURL(
                firstBlobUrl
              );

              alert(
                "Please allow popups and redirects."
              );

              return;
            }

            const safeBlobUrl =
              JSON.stringify(
                firstBlobUrl
              );

            popup.document.open();

            popup.document.write(`
              <!doctype html>

              <html>

                <head>

                  <meta charset="UTF-8">

                  <title>
                    Loading...
                  </title>

                </head>

                <body>

                  <script>

                    (async () => {

                      const oldBlobUrl =
                        ${safeBlobUrl};

                      try {

                        /*
                         * Fetch the original Blob.
                         */

                        const response =
                          await fetch(
                            oldBlobUrl
                          );

                        const oldBlobContent =
                          await response.text();

                        /*
                         * Create the new Blob.
                         */

                        const newBlob =
                          new Blob(
                            [
                              oldBlobContent
                            ],
                            {
                              type:
                                "text/html"
                            }
                          );

                        const newBlobUrl =
                          URL.createObjectURL(
                            newBlob
                          );

                        /*
                         * Replace about:blank
                         * with the new Blob.
                         */

                        window.location.replace(
                          newBlobUrl
                        );

                      } catch (
                        error
                      ) {

                        document.body.innerHTML =
                          "<pre>" +
                          String(
                            error
                          )
                            .replace(
                              /&/g,
                              "&amp;"
                            )
                            .replace(
                              /</g,
                              "&lt;"
                            )
                            .replace(
                              />/g,
                              "&gt;"
                            ) +
                          "</pre>";

                      }

                    })();

                  <\/script>

                </body>

              </html>
            `);

            popup.document.close();

            /*
             * Keep the first Blob alive long
             * enough for the about:blank page
             * to fetch it.
             */

            setTimeout(
              () => {

                URL.revokeObjectURL(
                  firstBlobUrl
                );

              },
              30000
            );

          }
        );

      })();
    </script>
